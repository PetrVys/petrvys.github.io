<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetrVys</title>
<style>
  :root{
    --bg:#f6f8fa; --card:#ffffff; --fg:#1f2328; --muted:#636c76;
    --border:#d0d7de; --accent:#0969da; --chip:#eaeef2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --muted:#9198a1;
      --border:#30363d; --accent:#4493f8; --chip:#21262d;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:48px 16px}
  header{display:flex;align-items:center;gap:16px;margin-bottom:28px}
  header img{width:72px;height:72px;border-radius:50%;border:1px solid var(--border)}
  header h1{margin:0;font-size:1.6rem}
  header a{color:var(--accent);text-decoration:none}
  header .sub{color:var(--muted);font-size:.95rem}
  h2{font-size:1.05rem;color:var(--muted);font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;margin:28px 0 14px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  li{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  li a.name{color:var(--accent);font-weight:600;font-size:1.05rem;text-decoration:none}
  li a.name:hover{text-decoration:underline}
  .desc{color:var(--fg);margin:4px 0 8px}
  .meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:.85rem;align-items:center}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
  .chip{background:var(--chip);border-radius:20px;padding:2px 10px}
  footer{margin-top:40px;color:var(--muted);font-size:.85rem;text-align:center}
  .status{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="avatar" alt="" src="https://github.com/PetrVys.png?size=144">
    <div>
      <h1><a href="https://github.com/PetrVys">PetrVys</a></h1>
      <div class="sub" id="bio">github.com/PetrVys</div>
    </div>
  </header>

  <h2>Repositories</h2>
  <ul id="repos"><li class="status">Loading…</li></ul>

  <footer>Served via GitHub Pages.</footer>
</div>

<script>
const USER = "PetrVys";
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = s => new Date(s).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
const langColor = l => ({JavaScript:"#f1e05a",TypeScript:"#3178c6",Python:"#3572A5",C:"#555555",
  "C++":"#f34b7d","C#":"#178600",Go:"#00ADD8",Rust:"#dea584",Java:"#b07219",Shell:"#89e051",
  HTML:"#e34c26",CSS:"#563d7c",Ruby:"#701516",Kotlin:"#A97BFF",Swift:"#F05138"}[l] || "#8b949e");

(async () => {
  const list = document.getElementById("repos");
  try{
    const r = await fetch(`https://api.github.com/users/${USER}/repos?sort=updated&per_page=100`,
                          {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok) throw new Error(r.status);
    const repos = (await r.json()).filter(x => !x.fork);
    try{
      const u = await (await fetch(`https://api.github.com/users/${USER}`)).json();
      if(u.bio) document.getElementById("bio").textContent = u.bio;
      if(u.avatar_url) document.getElementById("avatar").src = u.avatar_url;
    }catch(e){}
    if(!repos.length){ list.innerHTML = '<li class="status">No public repositories.</li>'; return; }
    list.innerHTML = repos.map(x => `
      <li>
        <a class="name" href="${esc(x.html_url)}">${esc(x.name)}</a>
        ${x.description ? `<div class="desc">${esc(x.description)}</div>` : ""}
        <div class="meta">
          ${x.language ? `<span><span class="dot" style="background:${langColor(x.language)}"></span>${esc(x.language)}</span>` : ""}
          ${x.stargazers_count ? `<span>★ ${x.stargazers_count}</span>` : ""}
          <span class="chip">updated ${fmtDate(x.updated_at)}</span>
        </div>
      </li>`).join("");
  }catch(err){
    list.innerHTML = `<li class="status">Couldn't load repositories.
      See <a href="https://github.com/${USER}?tab=repositories">github.com/${USER}</a>.</li>`;
  }
})();
</script>
</body>
</html>
